name: Build Smart Home UI Manager

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar imágenes en GHCR después de compilar
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: build-smart-home-ui-manager
  cancel-in-progress: false

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: smart-home-ui-manager

jobs:
  init:
    name: Validate and initialize
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate application files
        shell: bash
        run: |
          set -euo pipefail
          bash -n ui_manager/run.sh
          python3 -m compileall -q ui_manager
          python3 -m json.tool ui_manager/components.json >/dev/null

      - name: Read application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*"\([^"]*\)"/\1/p' ui_manager/config.yaml)"
          if [[ -z "${version}" ]]; then
            echo "No se pudo leer la versión de ui_manager/config.yaml" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Versión detectada: ${version}"

      - name: Prepare multi-architecture matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }}
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build application image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ui_manager
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          push: ${{ inputs.publish }}
          version: ${{ needs.init.outputs.version }}

  manifest:
    name: Publish multi-architecture manifest
    if: ${{ inputs.publish == 'true' }}
    needs:
      - init
      - build
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
