name: Smart Home UI Manager
description: Instala, verifica e inventaría componentes personalizados para Home Assistant
version: "0.3.0"
slug: ui_manager
init: false

arch:
  - aarch64
  - amd64

startup: once
boot: manual_only

stage: experimental

homeassistant_api: true

map:
  - type: homeassistant_config
    read_only: false
    path: /config

options:
  local_inventory_enabled: false
  local_inventory_type: frontend
  local_inventory_name: ""
  local_inventory_version: ""
  local_inventory_path: ""
  mini_graph_card: true
  mushroom: true
  modern_circular_gauge: true
  sonofflan: true
  spook: true

schema:
  local_inventory_enabled: bool
  local_inventory_type: str
  local_inventory_name: str
  local_inventory_version: str
  local_inventory_path: str
  mini_graph_card: bool
  mushroom: bool
  modern_circular_gauge: bool
  sonofflan: bool
  spook: bool
