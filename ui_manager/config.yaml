name: Smart Home UI Manager
description: Instala y administra componentes personalizados para Home Assistant
version: "0.2.0"
slug: ui_manager
init: false

arch:
  - aarch64
  - amd64

startup: once
boot: manual

stage: experimental

homeassistant_api: true

map:
  - type: homeassistant_config
    read_only: false
    path: /config

options:
  mini_graph_card: true
  mushroom: true
  modern_circular_gauge: true
  sonofflan: true
  spook: true

schema:
  mini_graph_card: bool
  mushroom: bool
  modern_circular_gauge: bool
  sonofflan: bool
  spook: bool
